services:
  app:
    build: .
    ports:
      - '5173:5173'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://workapp:${POSTGRES_PASSWORD}@db:5432/workapp
      PORT: 5173
      AUTH_URL: ${AUTH_URL}
      ORIGIN: ${ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build:
      context: ./backup
    environment:
      DATABASE_URL: postgresql://workapp:${POSTGRES_PASSWORD}@db:5432/workapp
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: workapp
      POSTGRES_USER: workapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workapp -d workapp']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
